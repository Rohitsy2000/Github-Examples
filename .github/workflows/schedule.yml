name: 'my first workflow'
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main        
jobs:      
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: 'Git checkout'
              uses: actions/checkout@v4
            - name: 'Install Cowsay program'
              run: sudo apt-get install cowsay -y
            - name: Create directory (Cowsay) 
              run: mkdir -p cowsay 
            - name: Execute Cowsay CMD Tiger
              working-directory: cowsay
              run: cowsay -f dragon 'Run for cover, I am a dragon' >> dragon.txt
            - name: Execute Cowsay CMD Lion
              working-directory: cowsay
              run: cowsay -f tux 'Run for cover, I am a Tux'  >> tux.txt
            - name : List files
              working-directory: cowsay
              run: ls
            - name : Display Tiger and Lion
              working-directory: cowsay
              run: | 
                cat dragon.txt
                cat tux.txt      
            
